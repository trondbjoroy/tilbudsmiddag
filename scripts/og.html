<!doctype html>
<html lang="nb"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { background: #faf6f0; font-family: "Segoe UI", system-ui, sans-serif; color: #1f1b16; display: flex; flex-direction: column; justify-content: center; padding: 0 90px; box-sizing: border-box; position: relative; }
  .bar { position: absolute; inset: 0 0 auto 0; height: 14px; background: linear-gradient(90deg, #d99a1e, #a8432c, #d0647a, #7a5aa8, #2f74b5, #3f8f4c); }
  .logo { display: flex; align-items: center; gap: 18px; font: 700 44px Fraunces, Georgia, serif; }
  .mark { width: 64px; height: 64px; border-radius: 16px; background: #c8442b url("../assets/favicon.svg") center/cover; }
  h1 { font: 700 84px/1.05 Fraunces, Georgia, serif; margin: 34px 0 22px; letter-spacing: -0.02em; }
  p { font-size: 32px; color: #6f665c; margin: 0; max-width: 900px; line-height: 1.35; }
  .chips { display: flex; gap: 12px; margin-top: 36px; }
  .chips span { font-size: 24px; padding: 8px 18px; border-radius: 999px; background: #fff; border: 2px solid #e6ddd0; }
</style></head>
<body>
  <div class="bar"></div>
  <div class="logo"><span class="mark"></span>tilbudsmiddag.no</div>
  <h1>Middager fra ukens tilbud</h1>
  <p>Middagstips for hver dag, med oppskrift og handleliste som viser hvor varene er billigst.</p>
  <div class="chips"><span>REMA 1000</span><span>KIWI</span><span>Extra</span><span>MENY</span><span>SPAR</span><span>Coop</span></div>
</body></html>
