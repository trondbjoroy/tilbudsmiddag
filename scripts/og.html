<!doctype html>
<html lang="nb"><head><meta charset="utf-8">

<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,600..900&display=block" rel="stylesheet">
<style>

  .rail { height: 104px; background: #262c2e; color: #f4f6f6; display: flex; align-items: center; gap: 16px; padding: 0 84px; font: 800 44px Archivo, sans-serif; font-stretch: 75%; letter-spacing: -0.01em; }
  .rail img { width: 58px; height: 58px; }
  main { padding: 56px 84px 0; width: 760px; }
  h1 { font: 800 104px/0.98 Archivo, sans-serif; font-stretch: 75%; letter-spacing: -0.015em; word-spacing: 0.08em; margin: 0 0 26px; }

  .tag { position: absolute; right: 70px; top: 190px; width: 330px; height: 330px; }
  .shelf { position: absolute; left: 0; right: 0; bottom: 0; height: 22px; background: #262c2e; }

<body>
  <div class="rail"><img src="../assets/favicon.svg" alt="">tilbudsmiddag.no</div>
  <main>
    <h1>Middager fra ukens tilbud</h1>

  </main>
  <img class="tag" src="../assets/favicon.svg" alt="">
