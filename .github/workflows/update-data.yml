name: Oppdater tilbud

# Henter nye tilbud hver søndag, når kjedene har publisert ukens aviser.
on:
  schedule:
    - cron: '0 16 * * 0' # søndag 18:00 norsk sommertid (17:00 vintertid)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/update-data.mjs
      - name: Commit nye tilbud
        run: |
          git config user.name "tilbudsmiddag-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/offers.json
          git diff --cached --quiet || git commit -m "Oppdater tilbud $(date -u +%F)"
          git push
