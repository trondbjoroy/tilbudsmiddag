name: Oppdater tilbud

# Fast kjøring er slått av til vi har avtale med Tjek om bruk av API-et.
# Slå på igjen ved å legge til:
#   schedule:
#     - cron: '0 4,16 * * *' # 06:00 og 18:00 norsk sommertid
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/update-data.mjs
      - name: Commit nye tilbud
        run: |
          git config user.name "tilbudsmiddag-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/offers.json
          git diff --cached --quiet || git commit -m "Oppdater tilbud $(date -u +%F)"
          git push
